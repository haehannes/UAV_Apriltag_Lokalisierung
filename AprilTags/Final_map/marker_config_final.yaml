# AprilTag-Bahnen - Konfiguration
# Alle Laengen in Metern. Markerposition = Tag-Mitte,
# size = Kantenlaenge des schwarzen Quadrats (= tagsize).

field:
  length: 5.0
  lane_width: 1.3
  n_lanes: 3

defaults:
  family: tag36h11
  rotate_180: true

output:
  path: apriltag_map.pdf
  px_per_module: 100
  quiet_modules: 1.0
  label: true
  label_pt: 7.0
  registration_marks: true
  alignment_ticks: true
  tick_spacing: 0.5
  tick_len: 0.05
  tick_width: 14
  tick_label: false

markers:
