#Die tags waren alle völlig frei, abgesehen von Tag 0.



tagslam_parameters:
  # --- Lauf 1: grobe Orientierung, kurze Laufzeit ----------------
  optimizer_mode: fast              # iSAM2 ohne Fehlerpruefung -> schnellster Modus
  minimum_viewing_angle: 15.0
  minimum_tag_area: 2500
  max_num_incremental_opt: 50       # seltene volle Optimierung -> schnell (Default)
  pixel_noise: 1.0
  max_subgraph_error: 50.0          # tolerant (im fast-Modus ohnehin inaktiv)
  subgraph_abs_prior_position_noise: 0.15
  subgraph_abs_prior_rotation_noise: 0.15
  use_approximate_sync: true
  drop_time_fraction: 0.0


body_defaults:
  position_noise: 1.0               # alle nicht fixierten Tags weitgehend frei
  rotation_noise: 1.0


default_body: tag_map


bodies:
- tag_map:
    type: simple
    is_static: true
    default_tag_size: 0.170
    pose:
      position: {x: 0.0, y: 0.0, z: 0.0}
      rotation: {x: 0.0, y: 0.0, z: 0.0}
      position_noise: {x: 1.0, y: 1.0, z: 1.0}
      rotation_noise: {x: 1.0, y: 1.0, z: 1.0}
    tags:
    # --- Anker / globaler Ursprung -------------------------------
    - id: 0
      size: 0.170
      pose:
        position: {x: 0.0, y: 0.0, z: 0.0}
        rotation: {x: 0.0, y: 0.0, z: 0.0}
        position_noise: {x: 1.0e-06, y: 1.0e-06, z: 1.0e-06}
        rotation_noise: {x: 1.0e-06, y: 1.0e-06, z: 1.0e-06}
    # --- restliche Tags: nur id + size, Lage frei ----------------
    #     (Rauschen kommt aus body_defaults)
