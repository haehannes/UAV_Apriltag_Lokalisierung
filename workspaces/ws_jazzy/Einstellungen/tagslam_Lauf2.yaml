tagslam_parameters:
  # --- Lauf 2: genaue Karte, begrenzte Laufzeit ------------------
  optimizer_mode: fast              # iSAM2 + Fehlerpruefung + voller GTSAM-Rueckfall
  minimum_viewing_angle: 15.0
  minimum_tag_area: 2500
  max_num_incremental_opt: 10       # haeufige volle Optimierung -> genauer
  pixel_noise: 1.0
  max_subgraph_error: 10.0          # streng -> Ausreisser-Frames werden verworfen
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: true
  drop_time_fraction: 0.0


body_defaults:
  position_noise: 1.0
  rotation_noise: 1.0


default_body: tag_map


bodies:
- tag_map:
    type: simple
    is_static: true
    default_tag_size: 0.167
    pose:
      position: {x: 0.0, y: 0.0, z: 0.0}
      rotation: {x: 0.0, y: 0.0, z: 0.0}
      position_noise: {x: 1.0, y: 1.0, z: 1.0}
      rotation_noise: {x: 1.0, y: 1.0, z: 1.0}
    tags:
    # --- Anker / globaler Ursprung -------------------------------
    - id: 0
      size: 0.167
      pose:
        position: {x: 0.0, y: 0.0, z: 0.0}
        rotation: {x: 0.0, y: 0.0, z: 0.0}
        position_noise: {x: 1.0e-06, y: 1.0e-06, z: 1.0e-06}
        rotation_noise: {x: 1.0e-06, y: 1.0e-06, z: 1.0e-06}
    # --- restliche Tags: x/y und Yaw aus Lauf-1-Karte, staerker fixiert
    #     z=0 (Boden) und Roll/Pitch=0 (flach) hart gepinnt
    - id: 1
      size: 0.120
